# Process profile: IndPenSim 100,000 L fed-batch penicillin simulation
# (Goldrick et al. 2015, J. Biotechnol. 193:70-82; data CC BY 4.0).
# Maps the shared rule book's roles to IndPenSim variables and adjusts parameters
# for a ~230 h fed-batch with 12-hourly offline assays. Draft, like the rule book.
name: IndPenSim penicillin (simulated)
roles:
  biomass: biomass_offline      # offline assay, every 12 h, ~4 h delay
  oxygen: do2_mg_l
  ph: ph
  product: penicillin_offline   # offline assay, every 12 h, ~4 h delay
  temperature: temperature
parameters:
  product_phase_min_activity: 2.0   # g/L penicillin before product comparisons apply
  shift_search_h: [-12, 24]         # longer process, so larger timing shifts are plausible
  shift_min_h: 6
